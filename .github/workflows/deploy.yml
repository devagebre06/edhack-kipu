name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Web - Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest --silent
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  deploy-api:
    name: API - Railway
    runs-on: ubuntu-latest
    steps:
      - name: Railway deploys automatically via GitHub integration
        run: |
          echo "Railway service 'kipu-api' is connected to this repo (main branch)."
          echo "Push to main triggers a Railway deployment automatically — no CLI step needed."
          echo "Monitor at: https://railway.com/project/0b822f57-9199-4438-938c-17f7097e6f89"
