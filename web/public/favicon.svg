<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Kipu: quipu (cuerda principal + cuerdas colgantes con nudos).
       "Cada evidencia es un nudo en la cuerda." -->
  <defs>
    <linearGradient id="kipuBg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9a54ff"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#kipuBg)"/>

  <g stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none">
    <!-- cuerda principal -->
    <path d="M13 19 C 25 14.5, 39 14.5, 51 19"/>
    <!-- cuerdas colgantes -->
    <path d="M21.5 18.4 L 20.5 47"/>
    <path d="M32 17 L 32 51"/>
    <path d="M42.5 18.4 L 43.5 45"/>
  </g>

  <!-- nudos (posiciones asimétricas, como un quipu real) -->
  <g fill="#ffffff">
    <circle cx="21.2" cy="28" r="3.3"/>
    <circle cx="20.9" cy="39.5" r="3.3"/>
    <circle cx="32" cy="25" r="3.3"/>
    <circle cx="32" cy="35" r="3.3"/>
    <circle cx="32" cy="46" r="3.3"/>
    <circle cx="42.8" cy="30" r="3.3"/>
    <circle cx="43.1" cy="40.5" r="3.3"/>
  </g>
</svg>
