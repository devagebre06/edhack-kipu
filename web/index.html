<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Ícono / marca -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#863bff" />

    <title>Kipu — Trazabilidad pedagógica</title>
    <meta
      name="description"
      content="Kipu: plataforma de trazabilidad pedagógica para UGEL. Los docentes suben evidencias y la IA las evalúa contra rúbricas del CNEB, con paneles para directores y especialistas."
    />
    <meta name="application-name" content="Kipu" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111113" />

    <script>
      // Aplica el tema antes de pintar para evitar el destello (FOUC).
      // 'light' | 'dark' explícito, o preferencia del sistema por defecto.
      (function () {
        try {
          var t = localStorage.getItem('kipu-theme')
          var dark = t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
